name: Deploy Backend

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Build Spring Boot (Gradle)
        run: ./gradlew clean build -x test

      - name: Upload artifact   # v4 사용
        uses: actions/upload-artifact@v4
        with:
          name: spring-app
          path: build/libs/*.jar

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
        run: |
          # 키 복원
          echo "$SSH_KEY_B64" | base64 --decode > ./deploy_key
          chmod 600 ./deploy_key

          # 빌드
          ./gradlew clean build -x test

          JAR_FILE=$(ls build/libs/*SNAPSHOT.jar | head -n 1)
          echo "Will copy: $JAR_FILE"

          # scp 업로드
          scp -i ./deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no "$JAR_FILE" "$EC2_USER@$EC2_HOST:~/app.jar"

          # EC2에서 실행
          ssh -i ./deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" "
            pkill -f app.jar || true
            nohup java -jar ~/app.jar --server.address=0.0.0.0 > ~/app.log 2>&1 &
          "