name: Deploy Backend

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Build Spring Boot (Gradle)
        run: ./gradlew clean build -x test

      - name: Upload artifact (for record)   # v4로 업그레이드
        uses: actions/upload-artifact@v4
        with:
          name: spring-app
          path: build/libs/*.jar

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$SSH_KEY" > deploy_key
          chmod 600 deploy_key

          JAR_FILE=$(ls build/libs/*.jar | head -n 1)
          echo "Will copy: $JAR_FILE"

          scp -i deploy_key -o StrictHostKeyChecking=no "$JAR_FILE" "$EC2_USER@$EC2_HOST:~/app.jar"

          ssh -i deploy_key -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" "
            nohup java -jar ~/app.jar > ~/app.log 2>&1 &
          "